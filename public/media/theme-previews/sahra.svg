<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sh-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A241B"/>
      <stop offset="0.55" stop-color="#171410"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#C9A24D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C9A24D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2620"/>
      <stop offset="1" stop-color="#1E1A15"/>
    </linearGradient>
    <linearGradient id="sh-bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDBE6E"/>
      <stop offset="1" stop-color="#8A6A22"/>
    </linearGradient>
    <linearGradient id="sh-sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2EBDD"/>
      <stop offset="1" stop-color="#CDBFA6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#14120F"/>

  <!-- announcement -->
  <rect x="0" y="0" width="1200" height="28" fill="#1C1A17"/>
  <rect x="430" y="12" width="340" height="5" rx="2.5" fill="#A89E8C" opacity="0.8"/>
  <rect x="0" y="28" width="1200" height="1" fill="#2F2A22"/>

  <!-- header: centered wordmark, icons at the edges -->
  <rect x="0" y="29" width="1200" height="78" fill="#14120F"/>
  <path d="M60 60h18M60 68h18" stroke="#F2EBDD" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="108" cy="64" r="8" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
  <path d="M114 70l4 4" stroke="#F2EBDD" stroke-width="1.5" stroke-linecap="round"/>
  <text x="600" y="76" text-anchor="middle" fill="#F2EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="8">SAHRA</text>
  <circle cx="1052" cy="60" r="5" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
  <path d="M1044 74a8 8 0 0 1 16 0" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
  <path d="M1096 72s-7-4.5-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.5-7 9-7 9z" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
  <path d="M1132 60h12l1 14h-14zM1135 60v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
  <circle cx="1146" cy="58" r="5" fill="#C9A24D"/>
  <rect x="0" y="107" width="1200" height="1" fill="#2F2A22"/>
  <!-- nav row -->
  <g fill="#F2EBDD" opacity="0.85">
    <rect x="372" y="124" width="58" height="6" rx="3"/>
    <rect x="456" y="124" width="70" height="6" rx="3"/>
    <rect x="552" y="124" width="54" height="6" rx="3"/>
    <rect x="632" y="124" width="66" height="6" rx="3"/>
    <rect x="724" y="124" width="46" height="6" rx="3"/>
    <rect x="796" y="124" width="36" height="6" rx="3"/>
  </g>
  <rect x="552" y="135" width="54" height="1" fill="#C9A24D"/>
  <rect x="0" y="146" width="1200" height="1" fill="#2F2A22"/>

  <!-- cinematic hero -->
  <rect x="0" y="147" width="1200" height="330" fill="url(#sh-hero)"/>
  <rect x="0" y="147" width="1200" height="330" fill="url(#sh-glow)"/>
  <!-- perfume bottle silhouette -->
  <g transform="translate(905 200)">
    <rect x="52" y="0" width="36" height="26" rx="4" fill="url(#sh-bottle)"/>
    <rect x="58" y="26" width="24" height="14" fill="#8A6A22"/>
    <rect x="20" y="40" width="100" height="170" rx="10" fill="#1C1A17" stroke="#C9A24D" stroke-width="1.5"/>
    <rect x="34" y="70" width="72" height="120" rx="4" fill="#C9A24D" opacity="0.18"/>
    <rect x="30" y="60" width="4" height="120" rx="2" fill="#F2EBDD" opacity="0.25"/>
  </g>
  <!-- hero copy (centered) -->
  <rect x="440" y="222" width="30" height="1" fill="#C9A24D"/>
  <rect x="484" y="219" width="232" height="6" rx="3" fill="#C9A24D"/>
  <rect x="730" y="222" width="30" height="1" fill="#C9A24D"/>
  <text x="600" y="292" text-anchor="middle" fill="#F2EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="54">A scent to be told</text>
  <text x="600" y="346" text-anchor="middle" fill="#F2EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic">a gold to be gifted</text>
  <rect x="420" y="372" width="360" height="6" rx="3" fill="#F2EBDD" opacity="0.6"/>
  <rect x="460" y="386" width="280" height="6" rx="3" fill="#F2EBDD" opacity="0.6"/>
  <rect x="470" y="416" width="124" height="38" fill="#F2EBDD"/>
  <rect x="498" y="433" width="68" height="5" rx="2.5" fill="#14120F"/>
  <rect x="606" y="416" width="124" height="38" fill="none" stroke="#C9A24D" stroke-width="1"/>
  <rect x="640" y="433" width="56" height="5" rx="2.5" fill="#F2EBDD"/>

  <!-- section title with gold rule -->
  <text x="600" y="530" text-anchor="middle" fill="#F2EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="26">New arrivals</text>
  <rect x="576" y="542" width="48" height="1" fill="#C9A24D"/>

  <!-- product cards (portrait) -->
  <g>
    <rect x="60" y="566" width="255" height="170" fill="url(#sh-card)"/>
    <rect x="150" y="596" width="74" height="110" rx="6" fill="#C9A24D" opacity="0.55"/>
    <rect x="170" y="584" width="34" height="18" rx="3" fill="#DDBE6E"/>
    <rect x="72" y="578" width="40" height="14" fill="#F2EBDD"/>
    <rect x="130" y="750" width="115" height="8" rx="3" fill="#F2EBDD"/>
    <rect x="160" y="768" width="55" height="6" rx="3" fill="#C9A24D"/>

    <rect x="335" y="566" width="255" height="170" fill="url(#sh-card)"/>
    <circle cx="462" cy="651" r="44" fill="none" stroke="#C9A24D" stroke-width="6"/>
    <circle cx="462" cy="607" r="9" fill="#DDBE6E"/>
    <rect x="405" y="750" width="115" height="8" rx="3" fill="#F2EBDD"/>
    <rect x="435" y="768" width="55" height="6" rx="3" fill="#C9A24D"/>

    <rect x="610" y="566" width="255" height="170" fill="url(#sh-card)"/>
    <path d="M700 728c-8-60-2-100 16-138h24c18 38 24 78 16 138z" fill="#2B2620" stroke="#4A4234" stroke-width="1.5"/>
    <path d="M708 728c-4-52 0-92 10-128" stroke="#C9A24D" stroke-width="1" fill="none"/>
    <rect x="680" y="750" width="115" height="8" rx="3" fill="#F2EBDD"/>
    <rect x="710" y="768" width="55" height="6" rx="3" fill="#C9A24D"/>

    <rect x="885" y="566" width="255" height="170" fill="url(#sh-card)"/>
    <rect x="965" y="626" width="94" height="80" fill="url(#sh-sand)"/>
    <rect x="1008" y="626" width="8" height="80" fill="#C9A24D"/>
    <rect x="965" y="662" width="94" height="8" fill="#C9A24D"/>
    <path d="M1000 626c-10-20 2-28 12-14 10-14 22-6 12 14" fill="none" stroke="#C9A24D" stroke-width="3"/>
    <rect x="897" y="578" width="40" height="14" fill="#D77A7A"/>
    <rect x="955" y="750" width="115" height="8" rx="3" fill="#F2EBDD"/>
    <rect x="985" y="768" width="55" height="6" rx="3" fill="#D77A7A"/>
  </g>

  <!-- bottom gold hairline -->
  <rect x="0" y="798" width="1200" height="2" fill="#C9A24D"/>
  <text x="1140" y="36" text-anchor="end" fill="#FFFFFF" font-size="0" font-family="Arial">Sahra</text>
</svg>
