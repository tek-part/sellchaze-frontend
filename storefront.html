<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- G2: a Google sign-in return carries a one-time code in the fragment. Take it out of the URL
         before anything else on the page (merchant head code, pixels) runs; the app redeems it once. -->
    <script>(function(){try{if(location.pathname!=='/login/google'||location.hash.indexOf('code=')<0)return;var c=new URLSearchParams(location.hash.slice(1)).get('code');history.replaceState(history.state,'',location.pathname+location.search);Object.defineProperty(window,'__sfGoogleCode',{configurable:true,value:function(){var v=c;c=null;return v}})}catch(e){}})()</script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#073f4b" />
    <link rel="manifest" href="/storefront.webmanifest" />
    <link rel="icon" href="/pwa/icon.svg" />
    <meta name="color-scheme" content="light dark" />
    <style>
      /* The active theme is code-split. Keep its fully laid-out first frame hidden to prevent the
         empty mount from becoming a visible layout shift; ThemeProvider reveals it atomically. */
      #storefront-root { visibility: hidden; }
      html[data-storefront-ready='true'] #storefront-root { visibility: visible; }
    </style>
    <link rel="stylesheet" href="/media/fonts/storefront/fonts-62f8c85d5005.css" />
    <title>Store — Modern Luxury Fashion</title>
  </head>
  <body>
    <div id="storefront-root"></div>
    <script type="module" src="/src/apps/storefront/main.tsx"></script>
  </body>
</html>
