name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to Production
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true

          script: |
            set -e

            APP_DIR=/home/sellchaze/repos/frontend
            WEB_ROOT=/home/sellchaze/public_html

            mkdir -p /home/sellchaze/repos
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/tek-part/sellchaze-frontend.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            /bin/npm install

            /bin/npm run build

            # Keep the Laravel API subdomain and cPanel's CGI directory intact.
            find "$WEB_ROOT" -mindepth 1 -maxdepth 1 \
              ! -name 'api.sellchaze.com' \
              ! -name 'cgi-bin' \
              -exec rm -rf -- {} +

            cp -a dist/. "$WEB_ROOT/"
