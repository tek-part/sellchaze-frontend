name: Deploy Frontend

on:
  workflow_run:
    workflows: [Frontend Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Deploy Frontend to Production
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script_stop: true
          envs: DEPLOY_SHA

          script: |
            set -e

            APP_DIR=/home/sellchaze/repos/frontend
            WEB_ROOT=/home/sellchaze/public_html

            printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'

            mkdir -p /home/sellchaze/repos
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/tek-part/sellchaze-frontend.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"

            /bin/npm ci

            /bin/npm run build

            # Keep the Laravel API subdomain and cPanel's CGI directory intact.
            find "$WEB_ROOT" -mindepth 1 -maxdepth 1 \
              ! -name 'api.sellchaze.com' \
              ! -name 'cgi-bin' \
              -exec rm -rf -- {} +

            # cPanel owns the web-root directory metadata; copy file contents
            # without attempting to preserve the root directory timestamps.
            cp -R dist/. "$WEB_ROOT/"
