name: Deploy Frontend

on:
  workflow_run:
    workflows: [Frontend Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to the latest main that passed Quality)
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}

    steps:
      - name: Resolve commit and Quality run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -e
          if [ -n "$RUN_ID" ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"; echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Manual dispatch: latest successful Quality run on main (optionally for a given sha).
          if [ -n "$DEPLOY_SHA" ]; then
            row=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Frontend Quality" --branch main --status success --commit "$DEPLOY_SHA" --limit 1 --json databaseId,headSha --jq '.[0]')
          else
            row=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "Frontend Quality" --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0]')
          fi
          test -n "$row" && [ "$row" != "null" ] || { echo "No successful Quality run found"; exit 1; }
          echo "run_id=$(echo "$row" | jq -r .databaseId)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$row" | jq -r .headSha)" >> "$GITHUB_OUTPUT"
      - name: Pin DEPLOY_SHA
        run: echo "DEPLOY_SHA=${{ steps.resolve.outputs.sha }}" >> "$GITHUB_ENV"
      # The site is built once, in the Quality run, and shipped as-is. Building on the shared
      # cPanel host (npm ci + Vite) exhausted its CPU/IO limits and throttled the live site.
      - name: Download the built site from the Quality run
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ steps.resolve.outputs.sha }}
          path: dist
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build
        run: |
          test -f dist/index.html
          test -f dist/storefront.html
          # Without the .htaccess the SPA loses deep-link rewrites and cache/CORS headers.
          test -f dist/.htaccess
          du -sh dist

      # The host's brute-force protection (cPHulk) periodically locks SSH for everyone after
      # bots fail against root. Instead of failing the deploy, wait the lockout out: every SSH
      # step below retries for up to ~25 minutes. The host key is pinned to SSH_HOST_FINGERPRINT.
      - name: Prepare SSH (pinned host key, waits out lockouts)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          for i in $(seq 1 100); do
            ssh-keyscan -T 15 -p 22 "$SSH_HOST" > ~/.ssh/scanned 2>/dev/null || true
            if [ -s ~/.ssh/scanned ]; then break; fi
            echo "attempt $i: host not accepting SSH yet (lockout?) — retrying in 30s"; sleep 30
          done
          test -s ~/.ssh/scanned || { echo "SSH never became available"; exit 1; }
          if ssh-keygen -lf ~/.ssh/scanned | grep -qF "$SSH_FINGERPRINT" \
             || ssh-keygen -E md5 -lf ~/.ssh/scanned | grep -qF "$SSH_FINGERPRINT"; then
            cp ~/.ssh/scanned ~/.ssh/known_hosts
          else
            echo "Host key fingerprint mismatch:"; ssh-keygen -lf ~/.ssh/scanned; exit 1
          fi

      - name: Upload release
        run: |
          set -e
          # Retry only on SSH connection failures (exit 255 / scp transport errors), for ~25 min.
          try() { for i in $(seq 1 100); do "$@" && return 0; rc=$?; [ "$rc" -eq 255 ] || [ "$1" = scp ] || return "$rc"; echo "attempt $i: connection failed (rc=$rc) — retrying in 30s"; sleep 30; done; return 1; }
          OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15"
          RELEASE="/home/sellchaze/releases/$DEPLOY_SHA"
          try ssh $OPTS -p 22 "$SSH_USER@$SSH_HOST" "mkdir -p '$RELEASE'"
          try scp $OPTS -P 22 -r dist/. "$SSH_USER@$SSH_HOST:$RELEASE/"

      - name: Activate release
        run: |
          set -e
          cat > remote.sh <<'REMOTE'
          set -e
          RELEASE="/home/sellchaze/releases/$DEPLOY_SHA"
          WEB_ROOT=/home/sellchaze/public_html
          printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -f "$RELEASE/index.html"
          test -f "$RELEASE/storefront.html"
          test -f "$RELEASE/.htaccess"
          # Keep the Laravel API subdomain, cPanel's CGI directory and ACME challenges intact.
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete \
              --exclude 'api.sellchaze.com' --exclude 'cgi-bin' --exclude '.well-known' \
              "$RELEASE/" "$WEB_ROOT/"
          else
            find "$WEB_ROOT" -mindepth 1 -maxdepth 1 \
              ! -name 'api.sellchaze.com' ! -name 'cgi-bin' ! -name '.well-known' \
              -exec rm -rf -- {} +
            cp -R "$RELEASE/." "$WEB_ROOT/"
          fi
          # Keep the hashed bundles of the two previous releases available: a tab opened before
          # this deploy can still lazy-load its chunks instead of crashing.
          for prev in $(ls -1dt /home/sellchaze/releases/*/ 2>/dev/null | grep -v "$RELEASE/" | head -n 2); do
            [ -d "$prev/assets" ] && cp -Rn "$prev/assets/." "$WEB_ROOT/assets/" || true
          done
          # Tenant storefronts are served by Laravel from this shell (SpaShell); bundles load
          # from the dashboard origin. Copy it into the API app so the deploy is atomic.
          API_SHELL_DIR=/home/sellchaze/public_html/api.sellchaze.com/storage/app/storefront
          mkdir -p "$API_SHELL_DIR"
          cp "$RELEASE/storefront.html" "$API_SHELL_DIR/shell.html.tmp" && mv -f "$API_SHELL_DIR/shell.html.tmp" "$API_SHELL_DIR/shell.html"
          # Keep the three most recent releases for a quick rollback.
          ls -1dt /home/sellchaze/releases/*/ 2>/dev/null | tail -n +4 | xargs -r rm -rf --
          echo "Deployed $DEPLOY_SHA"
          REMOTE
          OPTS="-i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15"
          for i in $(seq 1 100); do
            if ssh $OPTS -p 22 "$SSH_USER@$SSH_HOST" DEPLOY_SHA="$DEPLOY_SHA" 'bash -s' < remote.sh; then exit 0; fi
            rc=$?; [ "$rc" -eq 255 ] || exit "$rc"
            echo "attempt $i: connection failed — retrying in 30s"; sleep 30
          done
          echo "SSH never became available"; exit 1
