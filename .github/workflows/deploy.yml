name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to Production
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script_stop: true

          script: |
            set -e

            cd /home/sellchaze/repos/frontend

            git fetch origin
            git reset --hard origin/main

            /bin/npm install

            /bin/npm run build

            rm -rf /home/sellchaze/public_html/*

            cp -a dist/. /home/sellchaze/public_html/
