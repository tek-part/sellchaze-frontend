name: Frontend Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run test -- --reporter=dot
      - run: npm run build
      # The editable source is older than production. Validate it above, but preserve the
      # captured live release for deployment until source reconciliation is complete.
      - name: Verify and restore the production baseline
        run: python3 scripts/production_baseline.py --output production-site
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: production-baseline-${{ github.sha }}
          path: production-site
          retention-days: 7
          if-no-files-found: error
          # Preserve .htaccess (SPA rewrites, cache + CORS headers) from production.
          include-hidden-files: true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm run test:perf
      # Reported but not enforced: the committed baselines were rendered on
      # win32, and Playwright resolves snapshots per platform, so Linux runners
      # have nothing to compare against. Re-enable as a gate once Linux
      # baselines are generated on this runner image.
      - run: npm run test:visual
        continue-on-error: true
      - run: npm run test:pwa
      - run: npm audit --audit-level=high
